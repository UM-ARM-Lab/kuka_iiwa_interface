right_arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.1
  kinematics_solver_attempts: 5
  mode: local
  stop_optimization_on_valid_solution: true
  position_scale: 1.
  rotation_scale: 0.5
  position_threshold: 0.004
  orientation_threshold: 0.03
  cost_threshold: 0.003
  minimal_displacement_weight: 0.01
  # minimal_displacement_weight: 0.005
  # avoid_joint_limits_weight: 0.05
  gd_step_size: 0.0001
  memetic_num_threads: 1
  memetic_population_size: 32
