left_arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.2
  kinematics_solver_attempts: 3
  mode: local
  stop_optimization_on_valid_solution: True
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.0008
  orientation_threshold: 0.01
  cost_threshold: 0.01
  minimal_displacement_weight: 0.01
  avoid_joint_limits_weight: 0.01
  gd_step_size: 0.0001
  memetic_num_threads: 8
  memetic_population_size: 32
