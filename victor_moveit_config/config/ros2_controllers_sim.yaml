# Joint state broadcaster (publishes /joint_states)
joint_state_broadcaster:
  ros__parameters:
    joints:
      - victor_left_arm_joint_1
      - victor_left_arm_joint_2
      - victor_left_arm_joint_3
      - victor_left_arm_joint_4
      - victor_left_arm_joint_5
      - victor_left_arm_joint_6
      - victor_left_arm_joint_7
      - victor_right_arm_joint_1
      - victor_right_arm_joint_2
      - victor_right_arm_joint_3
      - victor_right_arm_joint_4
      - victor_right_arm_joint_5
      - victor_right_arm_joint_6
      - victor_right_arm_joint_7
      # Gripper joints
      - victor_left_finger_a_joint_1
      - victor_left_finger_a_joint_2
      - victor_left_finger_a_joint_3
      - victor_left_finger_b_joint_1
      - victor_left_finger_b_joint_2
      - victor_left_finger_b_joint_3
      - victor_left_finger_c_joint_1
      - victor_left_finger_c_joint_2
      - victor_left_finger_c_joint_3
      - victor_left_palm_finger_b_joint
      - victor_left_palm_finger_c_joint
      - victor_right_finger_a_joint_1
      - victor_right_finger_a_joint_2
      - victor_right_finger_a_joint_3
      - victor_right_finger_b_joint_1
      - victor_right_finger_b_joint_2
      - victor_right_finger_b_joint_3
      - victor_right_finger_c_joint_1
      - victor_right_finger_c_joint_2
      - victor_right_finger_c_joint_3
      - victor_right_palm_finger_b_joint
      - victor_right_palm_finger_c_joint
    interfaces:
      - position
      - velocity
      - effort

# Force-torque sensor broadcasters
left_force_torque_broadcaster:
  ros__parameters:
    frame_id: victor_left_sunrise_palm_surface
    sensor_name: left_force_torque_sensor
    topic_name: /victor/left_arm/force_torque_state

right_force_torque_broadcaster:
  ros__parameters:
    frame_id: victor_right_sunrise_palm_surface
    sensor_name: right_force_torque_sensor
    topic_name: /victor/right_arm/force_torque_state
